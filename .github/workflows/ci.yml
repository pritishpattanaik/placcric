name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: placcric
          POSTGRES_PASSWORD: throwaway-ci-only
          POSTGRES_DB: placcric_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U placcric -d placcric_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://placcric:throwaway-ci-only@localhost:5432/placcric_test
      PLACCRIC_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_USER: placcric
          POSTGRES_PASSWORD: placeholder
      - run: docker build --build-arg PLACCRIC_VERSION=${{ github.sha }} -t placcric-app:ci .
